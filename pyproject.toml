[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-coursework-submission"
version = "0.2.0"
description = "Simulation study of filtered cart-pole reinforcement learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Дмитрий Нефедов"}]

[tool.setuptools.packages.find]
include = ["cartpole*", "scripts*"]
